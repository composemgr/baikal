# nginx proxy address - http://172.17.0.1:64118

name: baikal
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  baikal:
    image: ckulka/baikal:latest
    container_name: baikal-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: baikal-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64118:80'
    volumes:
      - './volumes/config/baikal:/var/www/baikal/config'
      - './volumes/data/baikal:/var/www/baikal/Specific'
    networks:
      - baikal

networks:
  baikal:
    name: baikal
    external: false
